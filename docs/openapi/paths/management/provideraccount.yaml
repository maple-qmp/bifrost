# Local-only account operations. Inference continues through the ordinary gateway APIs.
status:
  get:
    operationId: getProviderAccount
    summary: Read local account state
    description: Requires a same-origin loopback connection and provider management permissions. ChatGPT authorization expires after five minutes.
    tags: [Providers]
    security:
      - ManagementBearerAuth: []
      - BasicAuth: []
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [chatgpt, codebuddy]
    responses:
      '200':
        description: Successful account operation
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/providers.yaml#/LocalAccountStatus'
      '400':
        description: Account operation failed or credentials require reauthorization
      '403':
        description: Remote or cross-origin account operation is not allowed
      '404':
        description: Account provider is not configured
